
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المال</title>
<style>
:root{
  --green:#16a34a;--green-bg:#dcfce7;
  --yellow:#d97706;--yellow-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fee2e2;
  --blue:#2563eb;--blue-bg:#dbeafe;
  --bg:#f4f5f7;--card:#ffffff;--text:#1f2330;--sub:#6b7280;--border:#e5e7eb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111318;--card:#1a1d24;--text:#f0f1f4;--sub:#9aa0ac;--border:#2a2e38;}
}
:root[data-theme="dark"]{--bg:#111318;--card:#1a1d24;--text:#f0f1f4;--sub:#9aa0ac;--border:#2a2e38;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));
  min-height:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:16px;}
header.top{padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;}
header.top h1{font-size:20px;}
header.top .sub{color:var(--sub);font-size:13px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.big{font-size:26px;font-weight:700;}
.label{color:var(--sub);font-size:13px;margin-bottom:4px;}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.yellow{background:var(--yellow-bg);color:var(--yellow);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.blue{background:var(--blue-bg);color:var(--blue);}
.progress{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin:8px 0;}
.progress > div{height:100%;background:var(--blue);}
.progress.spend > div{background:var(--green);}
.progress.spend.warn > div{background:var(--yellow);}
.progress.spend.over > div{background:var(--red);}
button{cursor:pointer;font-family:inherit;}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;}
.btn.secondary{background:var(--border);color:var(--text);}
.btn.danger{background:var(--red);color:#fff;}
.btn.block{width:100%;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .meta{color:var(--sub);font-size:12px;}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px;}
nav.bottom{
  position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;
}
nav.bottom button{background:none;border:none;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
nav.bottom button.active{color:var(--blue);font-weight:700;}
nav.bottom button .ic{font-size:20px;}
.fab{
  position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--blue);color:#fff;border:none;border-radius:999px;width:60px;height:60px;font-size:28px;
  box-shadow:0 6px 16px rgba(37,99,235,.4);z-index:10;
}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;}
.modal h2{margin-bottom:14px;font-size:18px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;
}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.catbtn{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:8px 4px;font-size:20px;text-align:center;}
.catbtn.sel{border-color:var(--blue);background:var(--blue-bg);}
.catbtn .t{display:block;font-size:10px;margin-top:2px;color:var(--sub);}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}
.section-title{font-size:16px;font-weight:700;margin:18px 0 10px;}
.month-card{cursor:pointer;}
.sidebar-desktop{display:none;}
@media(min-width:860px){
  body{padding-bottom:16px;}
  nav.bottom,.fab{display:none;}
  .layout{display:flex;max-width:1100px;margin:0 auto;}
  .sidebar-desktop{display:flex;flex-direction:column;width:210px;padding:20px 10px;gap:4px;position:sticky;top:0;height:100vh;}
  .sidebar-desktop button{background:none;border:none;color:var(--sub);text-align:right;padding:10px 14px;border-radius:10px;font-size:14px;}
  .sidebar-desktop button.active{background:var(--blue-bg);color:var(--blue);font-weight:700;}
  .wrap{flex:1;}
  .fab-desktop{display:block;position:fixed;bottom:24px;left:24px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(37,99,235,.4);}
}
.fab-desktop{display:none;}
.hidden{display:none !important;}
.chartbar{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px;}
.chartbar .bar{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;}
.chartbar .lbl{font-size:10px;color:var(--sub);text-align:center;margin-top:4px;}
</style>
</head>
<body>

<div class="layout">
<div class="sidebar-desktop" id="sidebarDesktop"></div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>💰 إدارة المال</h1>
      <div class="sub" id="monthLabel">لا يوجد شهر مالي</div>
    </div>
  </header>

  <div id="page"></div>
</div>
</div>

<button class="fab" onclick="openExpenseModal()">+</button>
<button class="fab-desktop" onclick="openExpenseModal()">+ إضافة مصروف</button>

<nav class="bottom" id="bottomNav"></nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Storage ============ */
const KEY='moneyApp_v1';
function loadDB(){
  const raw=localStorage.getItem(KEY);
  if(raw){try{return JSON.parse(raw);}catch(e){}}
  return {settings:{},months:[],transactions:[],fixedExpenses:[],categories:[
    {id:'food',icon:'🍔',name:'أكل وشرب'},{id:'gas',icon:'⛽',name:'بنزين'},
    {id:'home',icon:'🏠',name:'أغراض البيت'},{id:'shopping',icon:'🛍️',name:'تسوق'},
    {id:'transport',icon:'🚗',name:'مواصلات'},{id:'coffee',icon:'☕',name:'قهوة'},
    {id:'fun',icon:'🎮',name:'ترفيه'},{id:'health',icon:'💊',name:'صحة'},
    {id:'clothes',icon:'👕',name:'ملابس'},{id:'tech',icon:'📱',name:'تقنية'},
    {id:'other',icon:'📦',name:'أخرى'}
  ], funds:{emergency:0,investment:0}, extraBalance:0};
}
let db=loadDB();
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmt(n){n=Number(n)||0;return n.toLocaleString('en-US',{minimumFractionDigits: n%1?2:0,maximumFractionDigits:2})+' ر.س';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

/* ============ Fiscal Month Logic ============ */
function dateOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
function toISO(d){return dateOnly(d).toISOString().slice(0,10);}

function ensureCurrentMonth(){
  if(!db.settings.salary||!db.settings.payDate||!db.settings.nextPayDate) return null;
  const start=dateOnly(new Date(db.settings.payDate));
  const end=dateOnly(new Date(db.settings.nextPayDate)); end.setDate(end.getDate()-1);
  let m=db.months.find(mm=>mm.start===toISO(start));
  if(!m){
    m={id:uid(),start:toISO(start),end:toISO(end),salary:db.settings.salary,targetRemaining:db.settings.targetRemaining||0};
    db.months.push(m); save();
  } else {
    m.end=toISO(end); m.salary=db.settings.salary; m.targetRemaining=db.settings.targetRemaining||0; save();
  }
  return m;
}
function currentMonth(){return ensureCurrentMonth();}

function monthTx(monthId){return db.transactions.filter(t=>t.monthId===monthId);}
function fixedTotal(){return db.fixedExpenses.reduce((s,f)=>s+Number(f.amount),0);}

function computeDailyBudgetInfo(month){
  if(!month) return null;
  const start=new Date(month.start), end=new Date(month.end);
  const totalDays=Math.round((end-start)/86400000)+1;
  const availableForDaily=Math.max(0, month.salary - fixedTotal() - month.targetRemaining);
  const baseDaily=availableForDaily/totalDays;
  const today=dateOnly(new Date());
  let dayIndex=Math.round((today-start)/86400000)+1;
  if(dayIndex<1)dayIndex=1; if(dayIndex>totalDays)dayIndex=totalDays;

  // walk day by day computing carry
  let carry=0, spentSoFar=0;
  const txs=monthTx(month.id).filter(t=>t.type==='expense');
  for(let d=1; d<=dayIndex; d++){
    const dayDate=new Date(start); dayDate.setDate(dayDate.getDate()+(d-1));
    const dISO=toISO(dayDate);
    const daySpent=txs.filter(t=>t.date===dISO).reduce((s,t)=>s+Number(t.amount),0);
    const allowedToday=baseDaily+carry;
    carry=allowedToday-daySpent;
    if(d<dayIndex) spentSoFar+=daySpent;
  }
  const todayISO=toISO(today);
  const todaySpent=txs.filter(t=>t.date===todayISO).reduce((s,t)=>s+Number(t.amount),0);
  const allowedTodayBeforeSpend=baseDaily+(carry+todaySpent - baseDaily - (carry - (baseDaily - (baseDaily))) ); // fallback recompute cleanly below
  // Recompute cleanly: allowedToday = baseDaily + carryIntoToday
  // carryIntoToday = carry value before today's spend was subtracted -> recompute
  let carry2=0;
  for(let d=1; d<dayIndex; d++){
    const dayDate=new Date(start); dayDate.setDate(dayDate.getDate()+(d-1));
    const dISO=toISO(dayDate);
    const daySpent=txs.filter(t=>t.date===dISO).reduce((s,t)=>s+Number(t.amount),0);
    const allowedToday=baseDaily+carry2;
    carry2=allowedToday-daySpent;
  }
  const allowedToday=baseDaily+carry2;
  const remainingToday=allowedToday-todaySpent;
  const totalSpentAll=txs.reduce((s,t)=>s+Number(t.amount),0);
  return {totalDays,dayIndex,availableForDaily,baseDaily,allowedToday,todaySpent,remainingToday,totalSpentAll};
}

/* ============ Accounts ============ */
function mainAccountBalance(month){
  if(!month) return 0;
  const txs=monthTx(month.id);
  let bal=month.salary - fixedTotal();
  txs.forEach(t=>{
    if(t.type==='expense') bal-=Number(t.amount);
    if(t.type==='fundTransfer') bal-=Number(t.amount);
  });
  return bal;
}

/* ============ Navigation ============ */
const PAGES=[
  {id:'home',icon:'🏠',label:'الرئيسية'},
  {id:'expenses',icon:'🧾',label:'المصروفات'},
  {id:'fixed',icon:'📌',label:'المصاريف الشهرية'},
  {id:'funds',icon:'🏦',label:'الصناديق'},
  {id:'extra',icon:'🎁',label:'أموال إضافية'},
  {id:'months',icon:'📅',label:'الشهور'},
  {id:'analysis',icon:'📊',label:'التحليل'},
  {id:'settings',icon:'⚙️',label:'الإعدادات'},
];
let currentPage='home';
function renderNav(){
  const bn=document.getElementById('bottomNav');
  const mobilePages=['home','expenses','funds','months'];
  bn.innerHTML=mobilePages.map(id=>{
    const p=PAGES.find(x=>x.id===id);
    return `<button class="${currentPage===id?'active':''}" onclick="goto('${id}')"><span class="ic">${p.icon}</span>${p.label}</button>`;
  }).join('')+`<button class="${currentPage==='settings'?'active':''}" onclick="goto('settings')"><span class="ic">⋯</span>المزيد</button>`;
  const sd=document.getElementById('sidebarDesktop');
  sd.innerHTML=PAGES.map(p=>`<button class="${currentPage===p.id?'active':''}" onclick="goto('${p.id}')">${p.icon} ${p.label}</button>`).join('');
}
function goto(id){currentPage=id; render();}

/* ============ Render ============ */
function render(){
  renderNav();
  const month=currentMonth();
  document.getElementById('monthLabel').textContent = month? `${month.start} ← ${month.end}` : 'لا يوجد شهر مالي';
  const page=document.getElementById('page');
  if(!db.settings.salary||!db.settings.payDate||!db.settings.nextPayDate){page.innerHTML=renderNoSalary();return;}
  switch(currentPage){
    case 'home': page.innerHTML=renderHome(month);break;
    case 'expenses': page.innerHTML=renderExpenses(month);break;
    case 'fixed': page.innerHTML=renderFixed();break;
    case 'funds': page.innerHTML=renderFunds();break;
    case 'extra': page.innerHTML=renderExtra();break;
    case 'months': page.innerHTML=renderMonths();break;
    case 'analysis': page.innerHTML=renderAnalysis(month);break;
    case 'settings': page.innerHTML=renderSettings();break;
  }
}
function renderNoSalary(){
  return `<div class="card empty">👋 ابدأ بإضافة راتبك لإنشاء أول شهر مالي.<br><br>
  <button class="btn" onclick="openSalaryModal()">إضافة الراتب</button></div>`;
}

function statusBadge(pct){
  if(pct>=100) return {cls:'red',text:'🔴 تجاوزت الميزانية'};
  if(pct>=70) return {cls:'yellow',text:'🟡 اقتربت من الحد اليومي'};
  return {cls:'green',text:'🟢 ضمن الميزانية'};
}

function renderHome(month){
  if(!month) return renderNoSalary();
  const info=computeDailyBudgetInfo(month);
  const bal=mainAccountBalance(month);
  const spentPct=info.allowedToday>0? Math.min(150,(info.todaySpent/info.allowedToday)*100):0;
  const st=statusBadge(spentPct);
  const recentTx=monthTx(month.id).filter(t=>t.type==='expense').slice(-5).reverse();
  let smartMsg='';
  const diff=info.remainingToday;
  if(diff>=0){
    smartMsg = spentPct<70? `أداؤك اليوم جيد، لديك ${fmt(diff)} متبقية من ميزانية اليوم.`
      : `اقتربت من ميزانية اليوم، المتبقي ${fmt(diff)}.`;
  } else {
    smartMsg = `تجاوزت ميزانية اليوم بـ ${fmt(Math.abs(diff))}، وسيتم احتساب التجاوز على الأيام القادمة.`;
  }
  return `
  <div class="card">
    <div class="badge ${st.cls}">${st.text}</div>
    <div style="margin-top:10px;font-size:14px">${smartMsg}</div>
  </div>
  <div class="grid2">
    <div class="card"><div class="label">الرصيد في الحساب الرئيسي</div><div class="big">${fmt(bal)}</div></div>
    <div class="card"><div class="label">المسموح اليوم</div><div class="big">${fmt(info.allowedToday)}</div>
      <div class="label" style="margin-top:6px">تم صرف ${fmt(info.todaySpent)}</div></div>
  </div>
  <div class="card">
    <div class="row"><span>الميزانية اليومية الكلية</span><span class="label">${fmt(info.totalSpentAll)} / ${fmt(info.availableForDaily)}</span></div>
    <div class="progress spend ${info.totalSpentAll/info.availableForDaily>1?'over':(info.totalSpentAll/info.availableForDaily>0.7?'warn':'')}"><div style="width:${Math.min(100,(info.totalSpentAll/(info.availableForDaily||1))*100)}%"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="label">الراتب</div><div class="big" style="font-size:18px">${fmt(month.salary)}</div></div>
    <div class="card"><div class="label">المصاريف الشهرية</div><div class="big" style="font-size:18px">${fmt(fixedTotal())}</div></div>
  </div>
  <div class="card"><div class="label">المبلغ المستهدف لنهاية الشهر</div><div class="big" style="font-size:18px">${fmt(month.targetRemaining)}</div></div>
  <div class="card">
    <div class="row"><b>الصناديق</b></div>
    <div class="row"><span>🚨 صندوق الطوارئ</span><b>${fmt(db.funds.emergency)}</b></div>
    <div class="row"><span>📈 صندوق الاستثمار</span><b>${fmt(db.funds.investment)}</b></div>
  </div>
  <div class="card">
    <div class="row"><b>آخر المصروفات</b><a style="font-size:13px;color:var(--blue);cursor:pointer" onclick="goto('expenses')">الكل</a></div>
    ${recentTx.length? recentTx.map(t=>renderTxItem(t)).join(''):'<div class="empty">لا توجد مصروفات حتى الآن</div>'}
  </div>`;
}

function renderTxItem(t){
  const cat=db.categories.find(c=>c.id===t.category)||{icon:'📦',name:t.category};
  return `<div class="list-item">
    <div><div>${cat.icon} ${cat.name}${t.description?' - '+t.description:''}</div><div class="meta">${t.date}</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <b>${fmt(t.amount)}</b>
      <button class="btn secondary" style="padding:4px 8px" onclick="editExpense('${t.id}')">✏️</button>
      <button class="btn danger" style="padding:4px 8px" onclick="deleteExpense('${t.id}')">🗑️</button>
    </div>
  </div>`;
}

function renderExpenses(month){
  if(!month) return renderNoSalary();
  const txs=monthTx(month.id).filter(t=>t.type==='expense').slice().reverse();
  return `<div class="section-title">المصروفات</div>
  <div class="card">
    ${txs.length? txs.map(renderTxItem).join(''):'<div class="empty">لا توجد مصروفات حتى الآن</div>'}
  </div>`;
}

function renderFixed(){
  const list=db.fixedExpenses;
  return `<div class="section-title">المصاريف الشهرية الثابتة</div>
  <div class="card">
    <div class="row"><b>الإجمالي</b><b>${fmt(fixedTotal())}</b></div>
  </div>
  <div class="card">
    ${list.length? list.map(f=>`<div class="list-item">
      <div><div>${f.name}</div><div class="meta">${f.category||''}</div></div>
      <div style="display:flex;align-items:center;gap:10px"><b>${fmt(f.amount)}</b>
      <button class="btn danger" style="padding:4px 8px" onclick="deleteFixed('${f.id}')">🗑️</button></div>
    </div>`).join(''):'<div class="empty">لا توجد مصاريف شهرية</div>'}
  </div>
  <button class="btn block" onclick="openFixedModal()">+ إضافة مصروف شهري</button>`;
}

function renderFunds(){
  return `<div class="section-title">الصناديق</div>
  <div class="grid2">
    <div class="card"><div class="label">🚨 صندوق الطوارئ</div><div class="big">${fmt(db.funds.emergency)}</div></div>
    <div class="card"><div class="label">📈 صندوق الاستثمار</div><div class="big">${fmt(db.funds.investment)}</div></div>
  </div>
  <div class="card">
    <button class="btn block" onclick="openFundModal('transfer')">تحويل من الحساب الرئيسي</button>
    <div style="height:8px"></div>
    <button class="btn secondary block" onclick="openFundModal('withdraw')">سحب من صندوق</button>
  </div>
  <div class="section-title">سجل عمليات الصناديق</div>
  <div class="card">${renderFundHistory()}</div>`;
}
function renderFundHistory(){
  const list=db.transactions.filter(t=>t.type==='fundTransfer'||t.type==='fundWithdraw').slice().reverse();
  if(!list.length) return '<div class="empty">لا توجد عمليات بعد</div>';
  return list.map(t=>`<div class="list-item">
    <div><div>${t.type==='fundTransfer'?'⬆️ تحويل إلى':'⬇️ سحب من'} ${t.fund==='emergency'?'صندوق الطوارئ':'صندوق الاستثمار'}${t.reason?' - '+t.reason:''}</div><div class="meta">${t.date}</div></div>
    <b>${fmt(t.amount)}</b>
  </div>`).join('');
}

function renderExtra(){
  const list=db.transactions.filter(t=>t.type==='extraIncome'||t.type==='extraWithdraw').slice().reverse();
  return `<div class="section-title">أموال إضافية</div>
  <div class="card"><div class="label">الرصيد الإضافي المتاح</div><div class="big">${fmt(db.extraBalance)}</div></div>
  <div class="card">
    <button class="btn block" onclick="openExtraModal()">+ إضافة مكافأة / دخل إضافي</button>
    <div style="height:8px"></div>
    <button class="btn secondary block" onclick="openExtraWithdrawModal()">سحب من الرصيد الإضافي</button>
  </div>
  <div class="section-title">السجل</div>
  <div class="card">${list.length? list.map(t=>`<div class="list-item"><div><div>${t.type==='extraWithdraw'?'⬇️ ':''}${t.description||(t.type==='extraWithdraw'?'سحب':'دخل إضافي')}</div><div class="meta">${t.date}</div></div><b>${t.type==='extraWithdraw'?'-':''}${fmt(t.amount)}</b></div>`).join(''):'<div class="empty">لا يوجد سجل</div>'}</div>`;
}

function renderMonths(){
  const list=db.months.slice().reverse();
  return `<div class="section-title">الشهور المالية</div>
  ${list.length? list.map(m=>{
    const dsum=monthTx(m.id).filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
    return `<div class="card month-card">
      <div class="row"><b>${m.start} ← ${m.end}</b></div>
      <div class="grid2" style="margin-top:8px">
        <div><div class="label">الراتب</div><div>${fmt(m.salary)}</div></div>
        <div><div class="label">المصروفات اليومية</div><div>${fmt(dsum)}</div></div>
      </div>
    </div>`;
  }).join(''):'<div class="card empty">لا توجد شهور سابقة</div>'}`;
}

function renderAnalysis(month){
  if(!month) return renderNoSalary();
  const txs=monthTx(month.id).filter(t=>t.type==='expense');
  const total=txs.reduce((s,t)=>s+Number(t.amount),0);
  const byCat={};
  txs.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+Number(t.amount);});
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const info=computeDailyBudgetInfo(month);
  const avg=info.dayIndex? (total/info.dayIndex):0;
  const maxBar=Math.max(1,...catArr.map(c=>c[1]));
  return `<div class="section-title">التحليل</div>
  <div class="grid2">
    <div class="card"><div class="label">إجمالي المصروفات اليومية</div><div class="big" style="font-size:18px">${fmt(total)}</div></div>
    <div class="card"><div class="label">متوسط المصروف اليومي</div><div class="big" style="font-size:18px">${fmt(avg)}</div></div>
  </div>
  <div class="card">
    <div class="label" style="margin-bottom:8px">أكثر التصنيفات إنفاقًا</div>
    <div class="chartbar">
    ${catArr.slice(0,6).map(([cid,amt])=>{
      const cat=db.categories.find(c=>c.id===cid)||{icon:'📦'};
      const h=Math.max(4,(amt/maxBar)*100);
      return `<div style="flex:1;text-align:center"><div class="bar" style="height:${h}px"></div><div class="lbl">${cat.icon}<br>${fmt(amt)}</div></div>`;
    }).join('')}
    </div>
    ${!catArr.length?'<div class="empty">لا توجد بيانات</div>':''}
  </div>`;
}

function renderSettings(){
  const s=db.settings;
  return `<div class="section-title">الإعدادات</div>
  <div class="card">
    <div class="row"><span>تاريخ نزول الراتب</span><b>${s.payDate||'-'}</b></div>
    <div class="row"><span>تاريخ نزول الراتب القادم</span><b>${s.nextPayDate||'-'}</b></div>
    <div class="row"><span>الراتب</span><b>${fmt(s.salary||0)}</b></div>
    <div class="row"><span>المبلغ المستهدف المتبقي</span><b>${fmt(s.targetRemaining||0)}</b></div>
    <button class="btn block" style="margin-top:10px" onclick="openSalaryModal()">تعديل بيانات الراتب</button>
  </div>
  <div class="card">
    <div class="row"><b>البيانات</b></div>
    <button class="btn secondary block" onclick="exportData()">تصدير البيانات (JSON)</button>
    <div style="height:8px"></div>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
    <button class="btn secondary block" onclick="document.getElementById('importFile').click()">استيراد البيانات</button>
    <div style="height:8px"></div>
    <button class="btn danger block" onclick="confirmClearData()">مسح جميع البيانات</button>
  </div>`;
}

/* ============ Modals ============ */
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBg').classList.add('open');}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

function openSalaryModal(){
  const s=db.settings;
  openModal(`<h2>بيانات الراتب</h2>
  <div class="field"><label>مبلغ الراتب</label><input id="f_salary" type="text" inputmode="decimal" value="${s.salary||''}"></div>
  <div class="field"><label>تاريخ نزول الراتب</label><input id="f_payDate" type="date" value="${s.payDate||''}"></div>
  <div class="field"><label>تاريخ نزول الراتب القادم</label><input id="f_nextPayDate" type="date" value="${s.nextPayDate||''}"></div>
  <div class="field"><label>المبلغ المستهدف المتبقي في نهاية الشهر</label><input id="f_target" type="text" inputmode="decimal" value="${s.targetRemaining||0}"></div>
  <button class="btn block" onclick="saveSalary()">حفظ</button>`);
}
function saveSalary(){
  const salary=parseFloat(document.getElementById('f_salary').value);
  const payDate=document.getElementById('f_payDate').value;
  const nextPayDate=document.getElementById('f_nextPayDate').value;
  const target=parseFloat(document.getElementById('f_target').value)||0;
  if(!salary||salary<=0){showToast('أدخل راتبًا صحيحًا');return;}
  if(!payDate){showToast('أدخل تاريخ نزول الراتب');return;}
  if(!nextPayDate){showToast('أدخل تاريخ نزول الراتب القادم');return;}
  if(new Date(nextPayDate)<=new Date(payDate)){showToast('تاريخ الراتب القادم يجب أن يكون بعد تاريخ الراتب الحالي');return;}
  db.settings.salary=salary; db.settings.payDate=payDate; db.settings.nextPayDate=nextPayDate; db.settings.targetRemaining=target;
  save(); ensureCurrentMonth();
  closeModal(); render(); showToast('تم الحفظ');
}

let selectedCat='food', editingTxId=null;
function openExpenseModal(){
  if(!currentMonth()){showToast('أضف الراتب أولاً');openSalaryModal();return;}
  editingTxId=null; selectedCat='food';
  openModal(expenseModalHTML());
  setTimeout(()=>document.getElementById('f_amount').focus(),100);
}
function editExpense(id){
  const t=db.transactions.find(x=>x.id===id);
  editingTxId=id; selectedCat=t.category;
  openModal(expenseModalHTML(t));
}
function expenseModalHTML(t){
  return `<h2>${t?'تعديل مصروف':'إضافة مصروف'}</h2>
  <div class="field"><label>المبلغ</label><input id="f_amount" type="text" inputmode="decimal" value="${t?t.amount:''}"></div>
  <div class="field"><label>التصنيف</label>
    <div class="catgrid">${db.categories.map(c=>`<button class="catbtn ${selectedCat===c.id?'sel':''}" onclick="selectCat('${c.id}')">${c.icon}<span class="t">${c.name}</span></button>`).join('')}</div>
  </div>
  <div class="field"><label>الوصف (اختياري)</label><input id="f_desc" type="text" value="${t?t.description||'':''}"></div>
  <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${t?t.date:toISO(new Date())}"></div>
  <button class="btn block" onclick="saveExpense()">${t?'حفظ التعديل':'حفظ المصروف'}</button>`;
}
function selectCat(id){selectedCat=id; document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('sel')); event.target.closest('.catbtn').classList.add('sel');}
function saveExpense(){
  const amount=parseFloat(document.getElementById('f_amount').value);
  const date=document.getElementById('f_date').value;
  const desc=document.getElementById('f_desc').value;
  if(!amount||amount<=0){showToast('أدخل مبلغًا صحيحًا');return;}
  if(!date){showToast('أدخل تاريخًا صحيحًا');return;}
  const month=currentMonth();
  if(editingTxId){
    const t=db.transactions.find(x=>x.id===editingTxId);
    t.amount=amount; t.category=selectedCat; t.description=desc; t.date=date;
  } else {
    db.transactions.push({id:uid(),type:'expense',amount,category:selectedCat,description:desc,date,account:'main',monthId:month.id});
  }
  save(); closeModal(); render(); showToast('تم الحفظ');
}
function deleteExpense(id){
  if(!confirm('حذف هذا المصروف؟'))return;
  db.transactions=db.transactions.filter(t=>t.id!==id); save(); render();
}

function openFixedModal(){
  openModal(`<h2>إضافة مصروف شهري ثابت</h2>
  <div class="field"><label>اسم المصروف</label><input id="ff_name" type="text"></div>
  <div class="field"><label>المبلغ</label><input id="ff_amount" type="text" inputmode="decimal"></div>
  <div class="field"><label>ملاحظات (اختياري)</label><input id="ff_notes" type="text"></div>
  <button class="btn block" onclick="saveFixed()">حفظ</button>`);
}
function saveFixed(){
  const name=document.getElementById('ff_name').value.trim();
  const amount=parseFloat(document.getElementById('ff_amount').value);
  const notes=document.getElementById('ff_notes').value;
  if(!name){showToast('أدخل اسم المصروف');return;}
  if(!amount||amount<=0){showToast('أدخل مبلغًا صحيحًا');return;}
  db.fixedExpenses.push({id:uid(),name,amount,notes,fixed:true});
  save(); closeModal(); render(); showToast('تم الحفظ');
}
function deleteFixed(id){
  if(!confirm('حذف هذا المصروف الثابت؟'))return;
  db.fixedExpenses=db.fixedExpenses.filter(f=>f.id!==id); save(); render();
}

function openExtraModal(){
  openModal(`<h2>إضافة مكافأة / دخل إضافي</h2>
  <div class="field"><label>المبلغ</label><input id="fe_amount" type="text" inputmode="decimal"></div>
  <div class="field"><label>الوصف</label><input id="fe_desc" type="text" placeholder="مكافأة، هدية، استرداد..."></div>
  <button class="btn block" onclick="saveExtra()">حفظ</button>`);
}
function saveExtra(){
  const amount=parseFloat(document.getElementById('fe_amount').value);
  const desc=document.getElementById('fe_desc').value;
  if(!amount||amount<=0){showToast('أدخل مبلغًا صحيحًا');return;}
  db.transactions.push({id:uid(),type:'extraIncome',amount,description:desc,date:toISO(new Date())});
  db.extraBalance+=amount;
  save(); closeModal(); render(); showToast('تم الحفظ');
}

function openFundModal(mode){
  openModal(`<h2>${mode==='transfer'?'تحويل إلى صندوق':'سحب من صندوق'}</h2>
  <div class="field"><label>الصندوق</label>
    <select id="fu_fund"><option value="emergency">🚨 صندوق الطوارئ</option><option value="investment">📈 صندوق الاستثمار</option></select>
  </div>
  <div class="field"><label>المبلغ</label><input id="fu_amount" type="text" inputmode="decimal"></div>
  ${mode==='withdraw'?`<div class="field"><label>سبب السحب</label>
    <select id="fu_reason"><option>طوارئ</option><option>استثمار</option><option>شراء</option><option>تحويل</option><option>أخرى</option></select>
  </div>`:''}
  <div class="field"><label>ملاحظة (اختياري)</label><input id="fu_note" type="text"></div>
  <button class="btn block" onclick="saveFund('${mode}')">تأكيد</button>`);
}
function saveFund(mode){
  const fund=document.getElementById('fu_fund').value;
  const amount=parseFloat(document.getElementById('fu_amount').value);
  const note=document.getElementById('fu_note').value;
  if(!amount||amount<=0){showToast('أدخل مبلغًا صحيحًا');return;}
  if(mode==='transfer'){
    const month=currentMonth();
    if(!month){showToast('لا يوجد شهر مالي');return;}
    db.funds[fund]+=amount;
    db.transactions.push({id:uid(),type:'fundTransfer',amount,fund,description:note,date:toISO(new Date()),monthId:month.id});
  } else {
    if(db.funds[fund]<amount){showToast('الرصيد غير كافٍ في الصندوق');return;}
    const reason=document.getElementById('fu_reason').value;
    db.funds[fund]-=amount;
    db.transactions.push({id:uid(),type:'fundWithdraw',amount,fund,reason,description:note,date:toISO(new Date())});
  }
  save(); closeModal(); render(); showToast('تمت العملية');
}

function openExtraWithdrawModal(){
  if(db.extraBalance<=0){showToast('لا يوجد رصيد إضافي متاح للسحب');return;}
  openModal(`<h2>سحب من الرصيد الإضافي</h2>
  <div class="field"><label>المبلغ (المتاح ${fmt(db.extraBalance)})</label><input id="few_amount" type="text" inputmode="decimal"></div>
  <div class="field"><label>الوصف (اختياري)</label><input id="few_desc" type="text" placeholder="سبب السحب"></div>
  <button class="btn block" onclick="saveExtraWithdraw()">تأكيد السحب</button>`);
}
function saveExtraWithdraw(){
  const amount=parseFloat(document.getElementById('few_amount').value);
  const desc=document.getElementById('few_desc').value;
  if(!amount||amount<=0){showToast('أدخل مبلغًا صحيحًا');return;}
  if(amount>db.extraBalance){showToast('الرصيد الإضافي غير كافٍ');return;}
  db.transactions.push({id:uid(),type:'extraWithdraw',amount,description:desc,date:toISO(new Date())});
  db.extraBalance-=amount;
  save(); closeModal(); render(); showToast('تم السحب');
}

/* ============ Backup ============ */
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='money-app-backup.json'; a.click();
}
function importData(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{db=JSON.parse(r.result); save(); render(); showToast('تم الاستيراد بنجاح');}catch(err){showToast('ملف غير صالح');}};
  r.readAsText(file);
}
function confirmClearData(){
  openModal(`<h2>تأكيد الحذف</h2>
  <p style="margin-bottom:16px">هل أنت متأكد؟ سيتم حذف جميع البيانات ولا يمكن التراجع عن هذه العملية.</p>
  <div style="display:flex;gap:10px">
    <button class="btn danger block" onclick="clearAllData()">حذف الكل</button>
    <button class="btn secondary block" onclick="closeModal()">إلغاء</button>
  </div>`);
}
function clearAllData(){
  localStorage.removeItem(KEY); db=loadDB(); closeModal(); render(); showToast('تم مسح جميع البيانات');
}

/* numeric input guard */
document.addEventListener('input',e=>{
  if(e.target.getAttribute('inputmode')==='decimal'){
    e.target.value=e.target.value.replace(/[^0-9.]/g,'');
  }
});

render();
</script>
</body>
</html>
